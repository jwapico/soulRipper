# TODO: implement all of the unimplemented fields 

# NOTE: all paths must be absolute

paths:
  music_dir_root: /home/goop/soulRipper/debug/music                   # unimplemented
  output_path: /home/goop/soulRipper/debug/music                      # the path where your music will be downloaded
  youtube_cookie_filepath: /home/goop/soulRipper/assets/cookies.txt   # the path to your youtube cookies.txt file, yt-dlp may not work without this
  database_path: /home/goop/soulRipper/assets/soul.db                 # the path to the sqlite database file
  slskd_exe_path: ~                                                   # unimplemented applicable if you are using a specific release of slskd, otherwise we pull the latest docker image

download_behavior:
  youtube_only: False                                                 # if set to True will only download from yt-dlp
  soulseek_only: False                                                # unimplemented
  max_retries: 5                                                      # unimplemented
  inactive_download_timeout: 5                                        # unimplemented
  concurrent_downloads: 1                                             # the max number of files to download at the same time

audio:
  valid_extensions:
    - ".mp3"
    - ".flac"
    - ".wav"

privacy:
  spotify_scope: "user-library-read user-read-private playlist-read-collaborative playlist-read-private"

debug:
  log: True                                                           # unimplemented
  log_level: DEBUG                                                    # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_filepath: /home/goop/soulRipper/debug/log.txt                   # unimplemented
  db_echo: False
